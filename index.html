<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MitoWeaves</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div>
    <img src="Logo_prova.svg" alt="Logo" class="Logo">
  </div>
    <!-- 2. GRIGLIA CON I 5 SLOT DI BORSE -->
    <main class="catalogo-container">
        
        <!-- Slot 1 -->
        <div class="slot-borsa" onclick="apriZoom('images (2).jpeg', 'B01')">
            <div class="cornice-immagine">
                <img src="prova_foto1.png" alt="Borsa 1">
            </div>
            <p class="nome-borsa">B01</p>
        </div>

        <!-- Slot 2 -->
        <div class="slot-borsa" onclick="apriZoom('valigeria-ambrosetti-borsa-a-mano-in-pelle-con-tracolla-personalizzata-21100-bag-denim.gif', 'BORSA-02')">
            <div class="cornice-immagine">
                <img src="valigeria-ambrosetti-borsa-a-mano-in-pelle-con-tracolla-personalizzata-21100-bag-denim.gif" 
                alt="Borsa 2">
            </div>
            <p class="nome-borsa">BORSA-02</p>
        </div>

        <!-- Slot 3 -->
        <div class="slot-borsa" onclick="apriZoom('721-2IVORY8.jpg', 'BORSA-03')">
            <div class="cornice-immagine">
                <img src="721-2IVORY8.jpg" alt="Borsa 3">
            </div>
            <p class="nome-borsa">BORSA-03</p>
        </div>

        <!-- Slot 4 -->
        <div class="slot-borsa" onclick="apriZoom('221294_000-01.webp', 'BORSA-04')">
            <div class="cornice-immagine">
                <img src="221294_000-01.webp" alt="Borsa 4">
            </div>
            <p class="nome-borsa">BORSA-04</p>
        </div>

        <!-- Slot 5 -->
        <div class="slot-borsa" onclick="apriZoom('Z03YE007252N027_02S_high-res.jpg', 'BORSA-05')">
            <div class="cornice-immagine">
                <img src="Z03YE007252N027_02S_high-res.jpg" alt="Borsa 5">
            </div>
            <p class="nome-borsa">BORSA-05</p>
        </div>

    </main>

    <!-- FINESTRA DI ZOOM / LIGHTBOX (Inizialmente nascosta) -->
    <div id="modal-zoom" class="lightbox-overlay" onclick="chiudiZoom()">
        <div class="lightbox-contenuto" onclick="event.stopPropagation()">
            <span class="chiudi-btn" onclick="chiudiZoom()">&times;</span>
            <img id="img-zoomata" src="" alt="Borsa Zoomata">
            <h3 id="titolo-zoomato"></h3>
            <a href="#" id="btn-whatsapp" class="btn-richiesta">Scrivimi per informazioni</a>
        </div>
    </div>

    <!-- SCRIPT JAVASCRIPT PER GESTIRE IL CLICK -->
    <script>
        function apriZoom(urlImmagine, nomeBorsa) {
            const modal = document.getElementById('modal-zoom');
            const imgZoom = document.getElementById('img-zoomata');
            const titoloZoom = document.getElementById('titolo-zoomato');
            const btnWhatsapp = document.getElementById('btn-whatsapp');

            imgZoom.src = urlImmagine;
            titoloZoom.textContent = nomeBorsa;

            const testoMsg = encodeURIComponent(`Ciao! Vorrei avere informazioni sulla ${nomeBorsa}`);
            btnWhatsapp.href = `https://wa.me/39TUONUMERO?text=${testoMsg}`;

            modal.style.display = 'flex';
        }

        function chiudiZoom() {
            const modal = document.getElementById('modal-zoom');
            modal.style.display = 'none';
        }
    </script>

</body>
</html>
